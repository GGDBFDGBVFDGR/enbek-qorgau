<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Жұмыс принципі</title>
  <meta name="theme-color" content="#08120f">
  <script>
    try {
      var savedTheme = localStorage.getItem("eq-theme");
      if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
    } catch (error) { /* keep dark */ }
  </script>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <header class="header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html#labs" id="back">Зертхана</a>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-set-lang="kk">ҚАЗ</button>
        <button type="button" data-set-lang="ru">РУС</button>
        <button type="button" data-set-lang="en">ENG</button>
      </div>
      <button class="theme-toggle" type="button" id="theme-toggle" aria-pressed="false">☀</button>
    </div>
  </header>
  <main class="section" id="main">
    <div class="wrap">
      <p class="kicker" id="method-kicker"></p>
      <h1 id="method-title"></h1>
      <article class="lab-detail" id="method"></article>
    </div>
  </main>
  <script src="labs-detail.js?v=6"></script>
  <script src="labs-en.js?v=1"></script>
  <script src="method.js?v=1"></script>
</body>
</html>
